name: Deploy Backend to ACA

# 目前先「手動觸發」(Actions 分頁按 Run workflow)，避免還沒設好雲端 secret 就在每次 push 失敗。
# 正式要自動部署時，把下面 push 區塊取消註解(並確認已設 AZURE_CREDENTIALS)。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/deploy-backend.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/survey-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # multi-stage Dockerfile 內部自己 Maven build，故 CI 不需另外 setup-java / mvn package。
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name survey-api \
            --resource-group survey-rg \
            --image ${{ env.IMAGE }}:${{ github.sha }}
